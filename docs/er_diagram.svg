<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <style>
    .box { fill:#ffffff; stroke:#222; stroke-width:2 }
    .title { font: bold 14px sans-serif }
    .field { font: 12px monospace }
    .arrow { stroke:#222; stroke-width:2; marker-end:url(#arrowhead) }
  </style>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#222" />
    </marker>
  </defs>

  <!-- Organizations -->
  <rect x="40" y="40" width="220" height="80" class="box" />
  <text x="150" y="62" text-anchor="middle" class="title">organizations</text>
  <text x="60" y="86" class="field">org_id (PK)</text>

  <!-- Teams -->
  <rect x="320" y="40" width="220" height="100" class="box" />
  <text x="430" y="62" text-anchor="middle" class="title">teams</text>
  <text x="340" y="86" class="field">team_id (PK)</text>
  <text x="340" y="104" class="field">org_id (FK)</text>

  <!-- Users -->
  <rect x="40" y="160" width="300" height="120" class="box" />
  <text x="190" y="182" text-anchor="middle" class="title">users</text>
  <text x="60" y="206" class="field">user_id (PK)</text>
  <text x="60" y="224" class="field">org_id (FK)</text>
  <text x="60" y="242" class="field">email, full_name</text>

  <!-- Projects -->
  <rect x="320" y="180" width="300" height="120" class="box" />
  <text x="470" y="202" text-anchor="middle" class="title">projects</text>
  <text x="340" y="226" class="field">project_id (PK)</text>
  <text x="340" y="244" class="field">team_id (FK)</text>

  <!-- Sections -->
  <rect x="660" y="40" width="220" height="80" class="box" />
  <text x="770" y="62" text-anchor="middle" class="title">sections</text>
  <text x="680" y="86" class="field">section_id (PK)</text>
  <text x="680" y="104" class="field">project_id (FK)</text>

  <!-- Tasks -->
  <rect x="660" y="180" width="420" height="180" class="box" />
  <text x="870" y="202" text-anchor="middle" class="title">tasks</text>
  <text x="680" y="226" class="field">task_id (PK)</text>
  <text x="680" y="244" class="field">project_id (FK), section_id (FK), parent_task_id</text>
  <text x="680" y="262" class="field">assignee_id (FK), name, description</text>

  <!-- Comments, Tags, Attachments, Custom Fields -->
  <rect x="40" y="320" width="300" height="120" class="box" />
  <text x="190" y="342" text-anchor="middle" class="title">comments</text>
  <text x="60" y="366" class="field">comment_id (PK), task_id (FK), user_id (FK)</text>

  <rect x="360" y="320" width="220" height="120" class="box" />
  <text x="470" y="342" text-anchor="middle" class="title">tags</text>
  <text x="380" y="366" class="field">tag_id (PK), org_id (FK), name</text>

  <rect x="600" y="320" width="220" height="120" class="box" />
  <text x="710" y="342" text-anchor="middle" class="title">task_tags</text>
  <text x="620" y="366" class="field">id (PK), task_id (FK), tag_id (FK)</text>

  <rect x="840" y="320" width="240" height="120" class="box" />
  <text x="960" y="342" text-anchor="middle" class="title">attachments</text>
  <text x="860" y="366" class="field">attachment_id (PK), task_id (FK), filename</text>

  <rect x="360" y="460" width="360" height="100" class="box" />
  <text x="540" y="482" text-anchor="middle" class="title">custom_field_defs / values</text>
  <text x="380" y="506" class="field">field_id (PK), project_id (FK), name, type</text>

  <!-- Relationship arrows -->
  <line x1="260" y1="80" x2="320" y2="80" class="arrow" />
  <line x1="160" y1="160" x2="160" y2="200" class="arrow" />
  <line x1="360" y1="140" x2="360" y2="180" class="arrow" />
  <line x1="620" y1="160" x2="660" y2="160" class="arrow" />
  <line x1="620" y1="260" x2="660" y2="260" class="arrow" />
  <line x1="760" y1="320" x2="760" y2="360" class="arrow" />
  <line x1="760" y1="360" x2="680" y2="360" class="arrow" />

</svg>
